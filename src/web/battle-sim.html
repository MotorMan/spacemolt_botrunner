<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Simulator - SpaceMolt Commander</title>
  <link rel="stylesheet" href="/index.css">
  <link rel="stylesheet" href="/battle-sim.css">
</head>
<body>
  <div class="battle-sim-layout">
    <header class="battle-sim-header">
      <h3>Battle Simulator</h3>
      <span class="battle-sim-stats" id="battleSimStats">Loading catalog...</span>
    </header>

    <div class="battle-sim-filters">
      <div class="filter-group">
        <label>Runs per cell:</label>
        <input type="number" id="runsInput" value="10000" min="100" max="100000" step="100">
      </div>
      <div class="filter-group">
        <label>Seed:</label>
        <input type="number" id="seedInput" value="12345" min="0" max="2147483647">
      </div>
      <button class="primary" onclick="runSimulation()">Run Simulation</button>
      <button onclick="downloadJSON()">Download JSON</button>
    </div>

    <div class="battle-sim-fitters">
      <div class="fitter-column" id="fitterA">
        <div class="fitter-header">
          <h4>Ship A</h4>
          <button class="sm" onclick="loadPreset('A', 'annihilation')">Load Annihilation</button>
        </div>
        <div class="fitter-body">
          <div class="field">
            <label>Hull</label>
            <select id="hullA" onchange="onHullChange('A')"></select>
          </div>
          <div class="field">
            <label>Weapon Slots</label>
            <div class="slot-container" id="weaponSlotsA"></div>
          </div>
          <div class="field">
            <label>Defense Slots</label>
            <div class="slot-container" id="defenseSlotsA"></div>
          </div>
          <div class="field">
            <label>Utility Slots</label>
            <div class="slot-container" id="utilitySlotsA"></div>
          </div>
          <div class="skills-section">
            <h5>Skills</h5>
            <div class="skill-inputs">
              <div class="skill-input">
                <label>Weapons</label>
                <input type="number" id="skillWeaponsA" value="0" min="0" max="20">
              </div>
              <div class="skill-input">
                <label>Gunnery</label>
                <input type="number" id="skillGunneryA" value="0" min="0" max="20">
              </div>
              <div class="skill-input">
                <label>Shields</label>
                <input type="number" id="skillShieldsA" value="0" min="0" max="20">
              </div>
              <div class="skill-input">
                <label>Armor</label>
                <input type="number" id="skillArmorA" value="0" min="0" max="20">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="fitter-column" id="fitterB">
        <div class="fitter-header">
          <h4>Ship B</h4>
          <button class="sm" onclick="loadPreset('B', 'asset_forfeiture')">Load Asset Forfeiture</button>
        </div>
        <div class="fitter-body">
          <div class="field">
            <label>Hull</label>
            <select id="hullB" onchange="onHullChange('B')"></select>
          </div>
          <div class="field">
            <label>Weapon Slots</label>
            <div class="slot-container" id="weaponSlotsB"></div>
          </div>
          <div class="field">
            <label>Defense Slots</label>
            <div class="slot-container" id="defenseSlotsB"></div>
          </div>
          <div class="field">
            <label>Utility Slots</label>
            <div class="slot-container" id="utilitySlotsB"></div>
          </div>
          <div class="skills-section">
            <h5>Skills</h5>
            <div class="skill-inputs">
              <div class="skill-input">
                <label>Weapons</label>
                <input type="number" id="skillWeaponsB" value="0" min="0" max="20">
              </div>
              <div class="skill-input">
                <label>Gunnery</label>
                <input type="number" id="skillGunneryB" value="0" min="0" max="20">
              </div>
              <div class="skill-input">
                <label>Shields</label>
                <input type="number" id="skillShieldsB" value="0" min="0" max="20">
              </div>
              <div class="skill-input">
                <label>Armor</label>
                <input type="number" id="skillArmorB" value="0" min="0" max="20">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="battle-sim-results">
      <h4>Results</h4>
      <div class="results-content" id="resultsContent">
        <div class="empty-state">Configure ships and click Run Simulation</div>
      </div>
    </div>
  </div>

  <script src="/battle-sim.js"></script>
  <script>
    let catalogShips = [];
    let catalogModules = { weapon: [], defense: [], utility: [] };

    async function init() {
      try {
        await BattleSim.loadCatalog();
        catalogShips = BattleSim.getShips ? BattleSim.getShips() : Object.values(window.BattleSim.ships || []);
        
        if (typeof BattleSim.getModulesBySlot === 'function') {
          catalogModules.weapon = BattleSim.getModulesBySlot('weapon');
          catalogModules.defense = BattleSim.getModulesBySlot('defense');
          catalogModules.utility = BattleSim.getModulesBySlot('utility');
        }
        
        populateHullSelects();
        document.getElementById('battleSimStats').textContent = 
          `${catalogShips.length} ships, ${catalogModules.weapon.length} weapons, ${catalogModules.defense.length} defense, ${catalogModules.utility.length} utility modules`;
      } catch (e) {
        document.getElementById('battleSimStats').textContent = 'Failed to load catalog: ' + e.message;
      }
    }

    function populateHullSelects() {
      const selectA = document.getElementById('hullA');
      const selectB = document.getElementById('hullB');
      
      for (const ship of catalogShips) {
        const optA = document.createElement('option');
        optA.value = ship.id;
        optA.textContent = `${ship.name} (T${ship.tier} ${ship.class})`;
        selectA.appendChild(optA);
        
        const optB = document.createElement('option');
        optB.value = ship.id;
        optB.textContent = `${ship.name} (T${ship.tier} ${ship.class})`;
        selectB.appendChild(optB);
      }
    }

    function onHullChange(side) {
      const select = document.getElementById(`hull${side}`);
      const hullId = select.value;
      if (!hullId) return;
      
      const hull = BattleSim.getShip(hullId);
      if (!hull) return;
      
      buildSlotDropdowns(side, 'weapon', hull.weapon_slots || 0, hull.default_modules || []);
      buildSlotDropdowns(side, 'defense', hull.defense_slots || 0, hull.default_modules || []);
      buildSlotDropdowns(side, 'utility', hull.utility_slots || 0, hull.default_modules || []);
    }

    function buildSlotDropdowns(side, slotType, count, defaultModules) {
      const container = document.getElementById(`${slotType}Slots${side}`);
      const modules = catalogModules[slotType] || [];
      
      container.innerHTML = '';
      
      for (let i = 0; i < count; i++) {
        const select = document.createElement('select');
        select.id = `${slotType}${side}_${i}`;
        select.dataset.side = side;
        select.dataset.slotType = slotType;
        select.dataset.index = i;
        
        const emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        emptyOpt.textContent = '-- Empty --';
        select.appendChild(emptyOpt);
        
        for (const mod of modules) {
          const opt = document.createElement('option');
          opt.value = mod.id;
          opt.textContent = `${mod.name} (${mod.damage ? mod.damage + ' ' + mod.damage_type : mod.shield_bonus ? '+' + mod.shield_bonus + ' shield' : mod.armor_bonus ? '+' + mod.armor_bonus + ' armor' : mod.damage_reduction ? mod.damage_reduction + '% DR' : mod.shield_recharge_bonus ? '+' + mod.shield_recharge_bonus + ' recharge' : 'utility'})`;
          select.appendChild(opt);
        }
        
        const defaultMod = defaultModules.find(m => {
          const mod = BattleSim.getModule(m);
          return mod && mod.slot === slotType;
        });
        if (defaultMod) {
          select.value = defaultMod;
        }
        
        container.appendChild(select);
      }
    }

    function getFit(side) {
      const hullId = document.getElementById(`hull${side}`).value;
      if (!hullId) return null;
      
      const hull = BattleSim.getShip(hullId);
      const moduleIds = [];
      
      for (const slotType of ['weapon', 'defense', 'utility']) {
        const count = hull[`${slotType}_slots`] || 0;
        for (let i = 0; i < count; i++) {
          const select = document.getElementById(`${slotType}${side}_${i}`);
          if (select && select.value) {
            moduleIds.push(select.value);
          }
        }
      }
      
      const skills = {
        weapons: parseInt(document.getElementById(`skillWeapons${side}`).value) || 0,
        gunnery: parseInt(document.getElementById(`skillGunnery${side}`).value) || 0,
        shields: parseInt(document.getElementById(`skillShields${side}`).value) || 0,
        armor: parseInt(document.getElementById(`skillArmor${side}`).value) || 0
      };
      
      return BattleSim.resolveFit(hullId, moduleIds, skills);
    }

    async function runSimulation() {
      const fitA = getFit('A');
      const fitB = getFit('B');
      
      if (!fitA || !fitB) {
        alert('Please select hulls for both ships');
        return;
      }
      
      if (fitA.weapons.length === 0 && fitB.weapons.length === 0) {
        alert('At least one ship needs weapons');
        return;
      }
      
      const runs = parseInt(document.getElementById('runsInput').value) || 10000;
      const seed = parseInt(document.getElementById('seedInput').value) || 12345;
      
      const content = document.getElementById('resultsContent');
      content.innerHTML = '<div class="empty-state">Running simulation...</div>';
      
      try {
        const table = await BattleSim.runTable(fitA, fitB, runs, seed);
        const html = BattleSim.formatTableHTML(table);
        content.innerHTML = html;
      } catch (e) {
        content.innerHTML = `<div class="empty-state" style="color: var(--red)">Error: ${e.message}</div>`;
      }
    }

    async function loadPreset(side, name) {
      const fit = await BattleSim.loadPresetFit(name);
      if (!fit) return;
      
      document.getElementById(`hull${side}`).value = fit.hull;
      onHullChange(side);
      
      await new Promise(r => setTimeout(r, 50));
      
      for (let i = 0; i < fit.modules.length; i++) {
        const modId = fit.modules[i];
        const mod = BattleSim.getModule(modId);
        if (mod) {
          const slotType = mod.slot;
          const selects = document.querySelectorAll(`#${slotType}Slots${side} select`);
          for (const sel of selects) {
            if (!sel.value) {
              sel.value = modId;
              break;
            }
          }
        }
      }
      
      if (fit.skills) {
        document.getElementById(`skillWeapons${side}`).value = fit.skills.weapons || 0;
        document.getElementById(`skillGunnery${side}`).value = fit.skills.gunnery || 0;
        document.getElementById(`skillShields${side}`).value = fit.skills.shields || 0;
        document.getElementById(`skillArmor${side}`).value = fit.skills.armor || 0;
      }
    }

    async function downloadJSON() {
      const fitA = getFit('A');
      const fitB = getFit('B');
      const runs = parseInt(document.getElementById('runsInput').value) || 10000;
      const seed = parseInt(document.getElementById('seedInput').value) || 12345;
      
      if (!fitA || !fitB) return;
      
      const table = await BattleSim.runTable(fitA, fitB, runs, seed);
      
      const output = {
        shipA: { name: fitA.name, ...fitA },
        shipB: { name: fitB.name, ...fitB },
        runs,
        seed,
        table: table.map((row, i) => ({
          stanceA: BattleSim.STANCES[i],
          cells: row.map((cell, j) => ({
            stanceB: BattleSim.STANCES[j],
            ...cell
          }))
        }))
      };
      
      const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `battle-sim-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
